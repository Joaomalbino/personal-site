<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Analog — Joao Albino</title>
<meta name="description" content="Film photography by Joao Albino." />

<style>
  :root {
    --bg: #ffffff; --fg: #16130f; --muted: #7a746c; --line: #e7e3dc; --maxw: 60rem;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111010; --fg: #ece7df; --muted: #8f877c; --line: #2a2724; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: "Charter", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 19px; line-height: 1.7; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; padding: 4rem 1.5rem 6rem; }
  a { color: inherit; text-underline-offset: 3px; }
  .back {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.85rem; color: var(--muted); text-decoration: none; display: inline-block; margin-bottom: 2.5rem;
  }
  .back:hover { text-decoration: underline; }
  h1 { font-size: 1.9rem; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2; margin: 0 0 0.5rem; }
  .lede { color: var(--muted); margin: 0 0 3rem; font-style: italic; max-width: 40rem; }

  /* A combo is a set of three photos */
  .combo { margin: 0 0 3.5rem; }
  .combo-meta {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 0.78rem; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.9rem;
  }
  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem;
  }
  .grid img {
    width: 100%; height: 100%; aspect-ratio: 3 / 2; object-fit: cover;
    display: block; border-radius: 2px; background: var(--line);
    cursor: zoom-in; transition: opacity 0.15s ease;
  }
  .grid img:hover { opacity: 0.9; }
  @media (max-width: 640px) {
    .grid { grid-template-columns: 1fr; }
    .grid img { aspect-ratio: 3 / 2; }
  }

  /* Lightbox */
  .lightbox {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(0, 0, 0, 0.92);
    display: none; align-items: center; justify-content: center;
    padding: 1.5rem; cursor: zoom-out;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 100%; max-height: 100%; object-fit: contain;
    border-radius: 2px; box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .lightbox .close {
    position: absolute; top: 1rem; right: 1.25rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 1.6rem; line-height: 1; color: #fff; opacity: 0.7; cursor: pointer;
    background: none; border: none; padding: 0.25rem;
  }
  .lightbox .close:hover { opacity: 1; }

  footer {
    margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--muted);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 0.82rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">&larr; Joao Albino</a>

    <h1>Analog</h1>
    <p class="lede">Shot on film, mostly while travelling. Grouped in threes.</p>

    <!-- COMBO: copy this whole block to add a new set of three -->
    <section class="combo">
      <p class="combo-meta">Muay Thai &middot; Bangkok</p>
      <div class="grid">
        <img src="photos/muay-thai-1.jpeg" alt="Two Muay Thai fighters kneeling in prayer before a bout" loading="lazy" />
        <img src="photos/muay-thai-2.jpeg" alt="Two Muay Thai fighters exchanging blows in the ring" loading="lazy" />
        <img src="photos/muay-thai-3.jpeg" alt="A trainer tending to a fighter in the corner" loading="lazy" />
      </div>
    </section>
    <!-- END COMBO -->

    <footer>&copy; <span id="year">2026</span> Joao Albino &middot; <a href="index.html">home</a></footer>
  </div>

  <!-- Lightbox overlay -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="close" id="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      var lb = document.getElementById('lightbox');
      var lbImg = document.getElementById('lightbox-img');

      function open(src, alt) {
        lbImg.src = src;
        lbImg.alt = alt || '';
        lb.classList.add('open');
        lb.setAttribute('aria-hidden', 'false');
        document.body.style.overflow = 'hidden';
      }
      function close() {
        lb.classList.remove('open');
        lb.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        lbImg.src = '';
      }

      document.querySelectorAll('.grid img').forEach(function (img) {
        img.addEventListener('click', function () { open(img.src, img.alt); });
      });
      lb.addEventListener('click', close);
      document.getElementById('lightbox-close').addEventListener('click', close);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();
  </script>
</body>
</html>
